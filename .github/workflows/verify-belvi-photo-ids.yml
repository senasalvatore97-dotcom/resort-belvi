name: Verify Belvi editorial photo identities
on:
  push:
    paths: ['.github/workflows/verify-belvi-photo-ids.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pillow
        run: python -m pip install pillow
      - name: Compute image signatures
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path("assets").glob("belvi-editorial-*.webp")):
              im=Image.open(p).convert("RGB")
              a=list(im.convert("L").resize((9,8)).getdata())
              bits="".join("1" if a[y*9+x]>a[y*9+x+1] else "0" for y in range(8) for x in range(8))
              print(p.name,hex(int(bits,2))[2:].zfill(16),im.resize((1,1)).getpixel((0,0)),im.size,flush=True)
