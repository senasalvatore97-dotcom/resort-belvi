name: Import Resort Belvi editorial images
on:
  push:
    paths:
      - .github/workflows/import-belvi-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Download and optimize the five supplied images
        shell: python
        run: |
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen, Request
          from PIL import Image, ImageOps

          source = "https://raw.githubusercontent.com/senasalvatore97-dotcom/dubstack/main/"
          files = [
              "0D2FC037-C443-48FC-BC58-8F819BA72E10.png",
              "2EBA377A-97B5-4C3B-8BC8-BFAD1E4FEE3B.png",
              "335239EB-DC52-4E9F-BF40-B818C5BFBE2D.png",
              "EB3B61B7-536C-4FC4-BDEB-4873A114C9E2.png",
              "FE6B5B1C-BB43-464D-A34B-C5ED6E68B0AA.png",
          ]
          folder = Path("assets")
          folder.mkdir(exist_ok=True)
          for index, filename in enumerate(files, 1):
              request = Request(source + filename, headers={"User-Agent": "ResortBelviAssetImporter/1.0"})
              with urlopen(request, timeout=45) as response:
                  raw = response.read()
              img = Image.open(BytesIO(raw))
              img = ImageOps.exif_transpose(img).convert("RGB")
              img.thumbnail((2000, 1600), Image.Resampling.LANCZOS)
              out = folder / f"belvi-editorial-{index:02d}.webp"
              img.save(out, "WEBP", quality=85, method=6)
              print(f"{filename} -> {out}, {img.width}x{img.height}, {out.stat().st_size} bytes")
      - name: Commit optimized images to Resort Belvi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/belvi-editorial-*.webp
          git diff --cached --quiet || (git commit -m "assets: add five edited wedding photos for Resort Belvi" && git push)
